name: Daily Market Dip Alert

on:
  # ── Runs every weekday at 4:00 PM IST (10:30 AM UTC) ──────────────────────
  # NSE closes at 3:30 PM IST, so this fires 30 min after close
  schedule:
    - cron: '30 10 * * 1-5'

  # ── Also allows manual trigger from GitHub UI ──────────────────────────────
  workflow_dispatch:

jobs:
  send-market-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market dip alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python market_alert.py

  # ── Keep-alive: prevents GitHub from disabling scheduled workflows ─────────
  # GitHub auto-disables schedules after 60 days of repo inactivity.
  # This job commits a tiny timestamp file every Sunday to keep the repo alive.
  keep-alive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keep repo alive (prevent 60-day auto-disable)
        run: |
          # Only touch the file on Sundays (cron runs Mon–Fri, so skip weekdays)
          DAY=$(date +%u)   # 1=Mon … 7=Sun
          if [ "$DAY" = "1" ]; then
            # Touch on Monday (first run of the week) as a lightweight heartbeat
            echo "Last heartbeat: $(date -u)" > .github/keep_alive.txt
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/keep_alive.txt
            git diff --cached --quiet || git commit -m "chore: weekly keep-alive [skip ci]"
            git push
          else
            echo "Not Monday — skipping keep-alive commit."
          fi
