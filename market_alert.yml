name: Daily Market Dip Alert

on:
  # ── Runs every weekday at 4:00 PM IST (10:30 AM UTC) ──────────────────────
  # NSE closes at 3:30 PM IST, so this fires 30 min after close
  schedule:
    - cron: '30 10 * * 1-5'

  # ── Also allows manual trigger from GitHub UI ──────────────────────────────
  workflow_dispatch:

jobs:
  send-market-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market dip alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python market_alert.py
